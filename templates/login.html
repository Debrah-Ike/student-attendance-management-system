{% extends "base.html" %}
{% block title %}Login – Attendance System{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-calendar-check text-primary" style="font-size: 2.5rem;"></i>
                    <h4 class="mt-2 mb-0">Student Attendance</h4>
                    <p class="text-muted small">Management System</p>
                </div>
                <form method="POST" action="{{ url_for('login') }}" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Username or Email</label>
                        <input type="text" name="username" class="form-control" required
                               placeholder="e.g. admin or lecturer1" autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </button>
                </form>
                <hr>
                <div class="small text-muted">
                    <strong>Demo accounts:</strong><br>
                    Admin: <code>admin / admin123</code><br>
                    Lecturer: <code>lecturer1 / lect123</code><br>
                    Student: <code>student1 / stud123</code>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
