{% extends "base.html" %}
{% block title %}Add Course{% endblock %}

{% block content %}
<h3 class="mb-4">Add New Course</h3>
<div class="card" style="max-width: 560px;">
    <div class="card-body">
        <form method="POST" novalidate>
            <div class="mb-3">
                <label class="form-label">Course Code *</label>
                <input type="text" name="code" class="form-control" required placeholder="e.g. CS101">
            </div>
            <div class="mb-3">
                <label class="form-label">Title *</label>
                <input type="text" name="title" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="2"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Lecturer</label>
                <select name="lecturer_id" class="form-select">
                    <option value="">— Unassigned —</option>
                    {% for l in lecturers %}
                    <option value="{{ l.id }}">{{ l.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Create Course</button>
            <a href="{{ url_for('admin_courses') }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
